name: WaterTracker
options:
  bundleIdPrefix: com.tanushree.watertracker
  deploymentTarget:
    iOS: "17.0"
targets:
  WaterTracker:
    type: application
    platform: iOS
    sources:
      - Sources/WaterTracker
    scheme:
      testTargets: []
      configVariants: []
    info:
      path: Sources/WaterTracker/Info.plist
      properties:
        CFBundleDisplayName: Wyd
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSLocationWhenInUseUsageDescription: "Wyd uses your location to check local heat and humidity, and raises your daily water goal when conditions are harsh."

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tanushree.watertracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
